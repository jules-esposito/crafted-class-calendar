<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crafted | Class Calendar | Appellation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:    #1E3328;
    --midgreen: #2C4A3A;
    --sage:     #DDE8E2;
    --cream:    #F6F1E7;
    --paper:    #FFFDF8;
    --gold:     #BF9850;
    --gold-soft:#D8C39A;
    --charcoal: #1C1C1C;
    --gray-txt: #8A8678;
    --line:     rgba(30,51,40,0.10);
  }

  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Source Sans 3', Calibri, 'Trebuchet MS', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header / Logo ── */
  .site-header {
    background: var(--green);
    color: white;
    padding: 48px 48px 42px;
    text-align: center;
  }
  .logo-lockup { display: inline-block; }
  .logo-sprig { margin-bottom: 10px; opacity: 0.95; }
  .logo-appellation {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
    color: #fff;
    line-height: 1;
  }
  .logo-rule { height: 1px; background: var(--gold); width: 100%; margin: 10px 0 7px; opacity: 0.85; }
  .logo-healdsburg {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.54em;
    text-indent: 0.54em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .header-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 34px;
    font-weight: 600;
    margin-top: 30px;
    color: #fff;
    letter-spacing: 0.01em;
  }
  .header-sub {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 12px;
  }
  .gold-rule { height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); }

  .container { max-width: 1060px; margin: 0 auto; padding: 0 36px 80px; }

  .intro {
    text-align: center;
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 21px;
    color: var(--midgreen);
    max-width: 720px;
    margin: 44px auto 0;
    line-height: 1.6;
  }

  /* ── Property tabs (primary) ── */
  .property-tabs {
    display: flex; justify-content: center; gap: 4px;
    margin: 34px auto 0; padding: 5px;
    background: rgba(30,51,40,0.06);
    border-radius: 40px; width: fit-content;
  }
  .property-tab {
    font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-txt);
    background: none; border: none; padding: 9px 32px; border-radius: 40px;
    cursor: pointer; transition: color .2s, background .2s;
  }
  .property-tab:hover { color: var(--green); }
  .property-tab.active { color: #fff; background: var(--green); }

  /* ── Year tabs (secondary) ── */
  .year-tabs {
    display: flex; justify-content: center; gap: 4px;
    margin: 14px auto 0; padding: 4px;
    background: rgba(30,51,40,0.05);
    border-radius: 40px; width: fit-content;
  }
  .year-tab {
    font-family: 'Source Sans 3', sans-serif; font-size: 13.5px; font-weight: 600;
    letter-spacing: 0.14em; color: var(--gray-txt);
    background: none; border: none; padding: 7px 24px; border-radius: 40px;
    cursor: pointer; transition: color .2s, background .2s;
  }
  .year-tab:hover { color: var(--green); }
  .year-tab.active { color: #fff; background: var(--midgreen); }

  /* ── Month sections ── */
  .month-block { margin-top: 52px; }
  .month-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .month-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--green);
    white-space: nowrap;
  }
  .month-line { flex: 1; height: 1px; background: var(--line); }
  .month-dot { color: var(--gold); font-size: 11px; }

  /* ── Cards ── */
  .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .class-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 30px 32px;
    box-shadow: 0 1px 2px rgba(30,51,40,0.04);
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .class-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(30,51,40,0.10);
    border-color: var(--gold-soft);
  }
  .kicker {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 11px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .kicker::before { content: ""; width: 20px; height: 1.5px; background: var(--gold); display: inline-block; }
  .class-card.craft .kicker { color: var(--midgreen); }
  .class-card.craft .kicker::before { background: var(--midgreen); }
  .class-name {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 25px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 12px;
    line-height: 1.15;
  }
  .class-desc { font-size: 14px; color: #4a4a42; line-height: 1.68; }

  /* ── Red flag ── */
  .class-card.flagged { border-color: #D98C8C; box-shadow: 0 1px 2px rgba(155,35,53,0.10); }
  .flag {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    background: #FBEAEA; color: #9B2335; border: 1px solid #E2B3B3;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 11px; border-radius: 30px; margin-bottom: 12px;
  }

  /* ── Partner badges (outline) ── */
  .badges { display: flex; flex-wrap: wrap; gap: 7px; }
  .badge {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 30px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    color: var(--midgreen);
    background: rgba(191,152,80,0.06);
    border: 1px solid var(--gold-soft);
  }
  .badge-kicker {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ── Partners / Takeaways / Details meta ── */
  .card-meta {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .meta-row { display: flex; gap: 16px; align-items: baseline; }
  .meta-label {
    flex: 0 0 70px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    padding-top: 2px;
  }
  .class-card.craft .meta-label { color: var(--midgreen); }
  .meta-val { flex: 1; }
  .meta-val.takeaway { font-size: 13.5px; color: #4a4a42; line-height: 1.55; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 18px; }
  .detail-cell { display: flex; flex-direction: column; gap: 2px; }
  .detail-k { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .detail-v { font-size: 13.5px; color: var(--green); font-weight: 600; line-height: 1.35; }
  .meta-val.details { font-size: 13px; color: var(--green); font-weight: 600; letter-spacing: 0.01em; }
  .meta-tbd { font-size: 13px; font-style: italic; color: var(--gray-txt); }

  /* ── Footer ── */
  .footer { text-align: center; margin-top: 72px; padding-top: 30px; border-top: 1px solid var(--line); }
  .footer-tag { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 19px; color: var(--midgreen); }
  .footer-note { font-size: 11.5px; font-style: italic; color: var(--gray-txt); margin-top: 10px; }
  .footer-mark { font-size: 10.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gray-txt); margin-top: 12px; }

  .year-empty {
    text-align: center; font-family: 'EB Garamond', Georgia, serif; font-style: italic;
    font-size: 21px; color: var(--gray-txt); padding: 90px 20px;
  }

  @media (max-width: 760px) {
    .class-grid { grid-template-columns: 1fr !important; }
    .container { padding: 0 20px 56px; }
    .site-header { padding: 38px 24px 32px; }
    .header-title { font-size: 27px; }
    .logo-appellation { font-size: 23px; }
  }
  @media print {
    body { background: #fff; }
    .site-header, .class-card, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .month-block { break-inside: avoid; }
    .class-card { box-shadow: none; }
    .property-tabs, .year-tabs { display: none; }
  }
</style>
</head>

<script>
  // [kicker, name, description, [ [badgeType, partnerName], ... ], takeaway, details, flag ]
  const DATA_2026 = [
    ["August", [
      ["Culinary", "Beef & Bourbon on the Big Green Egg", "Two and a half hours, three exceptional cuts, and three premium bourbons from the house of WhistlePig. A Big Green Egg expert and Chef Charlie Palmer open with the question every serious cook should be able to answer: what really separates American wagyu from certified black angus, and how do you spot the best cut at the counter? Then you put theory to fire with wagyu flat iron, New York strip, and brisket, whisking together a bourbon marinade worth stealing, and learning to work the coals like you were born to it. A bourbon aficionado leads the tasting, showing you how each expression plays against the beef on your plate. You will leave able to buy beef like a butcher and grill it like a chef.", [["Partner","Big Green Egg"],["Partner","WhistlePig"]], "A Big Green Egg apron, recipes, and the know-how to buy, grill, and pair premium beef like a pro.", "$150 per guest  ·  Friday, August 28, 4-6:30pm  ·  Grange Patio  ·  12 guests"]    ]],
    ["September", [
      ["Culinary", "Mixology, Bubbles + Caviar", "The most decadent two hours of your week, set at Beeline. You begin with bubbles, as Joy Sterling of Iron Horse pours her celebrated estate sparkling, paired with a Hog Island oyster crowned with caviar. As you taste, Otto of Tsar Nicoulai introduces you to the briny world of sustainable California caviar, the thread that runs through this pour and the two cocktails to follow. From there it is hands on the shaker: an Appellation mixologist demonstrates two cocktails built to pair with caviar, a perfect martini and a bright, shaken yuzu creation. You mix each one yourself, then taste it against the bite chosen to match. Bubbles, then cocktail, then cocktail, every pour with its own perfect bite. When class winds down the indulgence rolls on, with Iron Horse and caviar specials at Beeline all evening.", [["Partner","Tsar Nicoulai Caviar"],["Partner","Iron Horse"]], "Recipe cards for both cocktails, a discount on Tsar Nicoulai caviar, and an invitation to an exclusive tasting menu at Folia's chef's counter.", "$150 per guest  ·  Saturday, September 12, 2-4pm  ·  Beeline"]    ]],
    ["October", [
      ["Culinary", "Little Pizzaiolo Workshop", "A Saturday afternoon spent with our Gozney outdoor ovens and your child. A Gozney pro teaches you to mix and stretch dough from scratch, then shares the tricks that separate a good pie from a great one. You will build your own pizzas with cured meats from Journeyman Meat Co. and cheese from Point Reyes, and fire them in a roaring Gozney oven, while the grown-ups sip pours from Dan Kosta. Two hours, one unforgettable pizza night, and a disposable camera in hand so you and your pizza master in training can capture memories made from scratch here at Appellation.", [["Partner","Gozney"],["Partner","Journeyman Meat Co."],["Partner","Point Reyes"],["Partner","Dan Kosta"]], "A recipe to recreate the magic at home, a disposable camera to capture every flour-dusted moment, and a handcrafted pizza to take home.", "$120 per parent + child pair  ·  Saturday, October 17, 4-6pm  ·  Grange Patio  ·  ages 7 and up  ·  10 pairs"]    ]],
    ["November", [
      ["Culinary", "Turkey 101", "The most useful two hours you will spend before the holiday. In an intimate class of just ten, Chef Charlie Palmer leads a hands-on master class in the whole bird, brining it for flavor, breaking it down with confidence, trussing, and roasting it to caramelized perfection. Winemaker Tom Rochioli pours alongside, pairing the turkey with the bottle he would put on his own Thanksgiving table. You roll up your sleeves for every step, and walk away ready to host the holiday like you've done it a hundred times.", [["Partner","Rochioli"],["Partner","Hestan"]], "Hestan cooking supplies, a recipe, and an invitation to the exclusive Rochioli wine dinner at Folia to follow.", "$200 per guest  ·  Thursday, November 19, 4-6pm  ·  Hestan Kitchen at Grange  ·  10 guests"]    ]],
    ["December", [
      ["Culinary", "Bûche de Noël", "Master the showstopping centerpiece of the French holiday table. Entirely from scratch, you will bake a tender sponge, whip a silky buttercream, and roll and decorate your own Bûche de Noël. Each step is paired with Mauritson port, the perfect sweet match for chocolate.", [["Partner","Mauritson Port"]], "A complete Bûche de Noël to take home, and the technique to make one from scratch.", "Saturday, December 19, 3-6pm  ·  Hestan Kitchen at Grange"],
      ["Craft", "Wreathmaking & Mulled Wine", "Cozy up with a mug of spiced mulled wine and the scent of fresh-cut evergreen. You will weave a full, fragrant wreath from locally gathered Sonoma greenery, layering in berries, ribbon, and seasonal accents until it is exactly your style.", [], "A full, fragrant wreath for your door and the know-how to keep it lush all season."]
    ]]
  ];

  const DATA_2027 = [
    ["January", [
      ["Wellness", "Rooted Rituals: Sound, Skincare & Tea", "Hosted by April Gargiulo, founder of Vintner's Daughter, this restorative Saturday morning opens with a sound bath in the Appellation Spa led by Appellation Director of Wellness Jill Cerutti. April then guides an intentional Vintner's Daughter skincare ritual rooted in mindfulness, botanical ingredients, and purposeful application. Afterward, guests gather for a botanical tea tasting alongside a seasonal bite from Chef Reed and the Appellation culinary team, made with ingredients from the culinary garden. Guests are invited to continue the experience with a spa booking to follow.", [["Partner","Vintner's Daughter"],["Partner","Appellation Spa"],["Partner","Local tea company (TBD)"]], "Vintner's Daughter samples and botanical tea sachets. Book an Appellation spa treatment after the event and receive a complimentary foot soak.", "Saturday, January 16, 2027  ·  10am-12pm  ·  Appellation Spa  ·  10-12 guests"]
    ]],
    ["February", [
      ["Culinary", "A Valentine's Truffle Pasta Workshop", "An intimate, candlelit cooking experience for couples and friends alike, led by Chef Reed. Set up in the Hestan demo kitchen, you will learn to make handmade gnocchi with local mushrooms, seasonal vegetables, and Bellwether Farms cheese, mastering proper dough texture, shaping technique, and how to build a restaurant-quality sauce, then finishing it all with fresh shaved truffle. Dry Creek olive oil and Mary Louise Bucher of Trattore guide a tasting of finishing oils throughout, before everyone sits down to enjoy their finished dish together.", [["Partner","Hestan Culinary"],["Partner","Dry Creek Olive Oil"],["Partner","Trattore (Mary Louise Bucher)"],["Partner","Bellwether Farms"],["Partner","Local mushroom grower (TBD)"],["Partner","Truffle partner (TBD)"]], "The recipe and a chocolate dessert to share later on the couch.", "$150 per guest  ·  Saturday, February 13, 2027  ·  6-8:30pm  ·  10-12 guests", "Jules to talk to Chef Reed about direction"]
    ]],
    ["March", [
      ["Live Fire", "Embers & Pinot: A Pigs & Pinot Preview", "In preparation for the annual Pigs & Pinot, we invite you to explore the relationship between pork, smoke, and Pinot Noir! Led by Chef Charlie Palmer, guests rotate through several Big Green Egg techniques, smoking heritage pork, grilling over direct heat, charring a seasonal condiment, and building a Pinot Noir barbecue glaze, while a featured winemaker leads a comparative Pinot tasting and explains how acidity, fruit, and tannin play against smoke, fat, spice, and sweetness. The workshop closes with a family-style tasting of the pork dishes you prepared.", [["Partner","Big Green Egg"],["Partner","Heritage-pork producer (TBD)"],["Partner","Innumerable Farms"]], "An Appellation spice rub and a Big Green Egg apron.", "Saturday, March 13, 2027  ·  4-6pm  ·  10-12 guests"]
    ]],
    ["April", [
      ["Culinary", "Garden-to-Oven Pizza Workshop", "A seasonal pizza class built around Sonoma County's spring harvest. You will learn to stretch and shape dough, manage the heat of a Gozney oven, and build beautifully balanced pizzas, preparing two each from combinations like spring alliums with garden herbs and local cheese, asparagus with preserved lemon and chile, or wild mushrooms with Bellwether Farms cheese. Throughout, you will sip Ra Ra Rosé, poured by winemaker Kara Groom.", [["Partner","Gozney"],["Partner","Front Porch Farm or Tookey Farms (TBD)"],["Partner","Central Milling"],["Partner","Local cheesemaker (TBD)"],["Partner","Ra Ra Rosé (Kara Groom)"]], "House-fermented pizza dough, a printed recipe, and Appellation pizza seasoning.", "Approximately 2.5 hours  ·  10-12 guests  ·  date TBD", "Needs rework: replace garden concept"]
    ]],
    ["May", [
      ["Culinary", "Cinco de Mayo Margarita Cabana", "Celebrate Cinco de Mayo poolside. Your pool pass is included, and the party moves into a private cabana where a master mixologist from Southern Glazer's walks you through the art of the perfect margarita. Shake, taste, and build three distinct margaritas, from a classic done right to a bolder, more inventive pour, learning the balance of citrus, agave, and salt along the way. Chef Carlos Mojica pairs every sip with a spread of unique Mexican street bites, made to be passed around the cabana and enjoyed in the sun. Make a day of it by adding a brunch reservation beforehand.", [["Partner","Southern Glazer's (SGWS)"],["Partner","Chef Carlos Mojica"]], "Three margarita recipes and the know-how to build them at home.", "$150 per person  ·  Sunday, May 2  ·  4-5:30pm  ·  Pool cabana  ·  20 guests"]
    ]],
    ["June", [
      ["Live Fire", "Fire, Salt & the Sonoma Coast", "A live-fire seafood workshop built on the Sonoma Coast's bounty. Guests begin with a lesson in oyster selection, handling, shucking, and safety, then prepare three variations, raw with a garden mignonette, fire-roasted with herb butter, and smoked with fermented chile or preserved citrus. Chef Thomas and the culinary team add a live-fire preparation of local fish or shellfish and a seasonal summer vegetable, while Marine Layer guides pairings across sparkling wine, Chardonnay, and coastal Pinot Noir.", [["Partner","Hog Island Oyster Co."],["Partner","Hestan or Big Green Egg (TBD)"],["Partner","Marine Layer"]], "An oyster knife, Hog Island salt, and the Appellation mignonette recipe.", "Approximately 2.5 hours  ·  Hog Island  ·  10-12 guests  ·  date TBD", "Class will take place at Hog Island"]
    ]],
    ["Ideas", [
      ["Culinary", "Pickling Class (September)", "A hands-on workshop in the art of the pickle. Learn to quick-pickle, brine, and ferment the best of the season's produce, and build the tangy, snappy condiments that make any plate sing. Everyone brines, packs, and jars their own to take home.", [], "A jar of your own pickles and the brine recipes.", "date TBD", "Idea stage, not yet confirmed"]
    ]]
  ];

  // Lodi 2027: scaffold; lineup to be confirmed
  const DATA_L2027 = [
    ["January", [
      ["Culinary", "The Art of Sourdough", "There is nothing like bread still warm from the oven, and by the end of this morning it will be yours to make at will. Appellation Lodi head baker Chef Anne walks you through the living craft of sourdough in Maison Lodi, from coaxing a tender, open crumb to feeding your starter and turning the discard into crackers, pancakes, and more. Sip a signature Maison beverage as you bake the day away, and leave with recipes straight from the Maison kitchen.", [["Partner","Local roaster (TBD)"]], "A sourdough starter, recipe cards, and coffee grounds* from a local roaster. *Confirm whether the grounds are from Peerless.", "$100 per guest  ·  Monday, January 18 (MLK Day)  ·  9-11am  ·  Maison Lodi  ·  10 guests"]
    ]],
    ["February", [
      ["Culinary", "The Aphrodisiac Hour", "Escape the cold, cozy up at the counter as the fire roars, and savor a glass of champagne. Once your palate is whet, in-house mixologist Victoria leads you behind the AH Bar to craft two signature cocktails built to set off caviar, each tasted against curated bites of Tsar Nicoulai caviar and briny Hog Island oysters. Along the way you will master aphrodisiac-inspired infused syrups and botanicals, the kind of flourish that makes a cocktail unforgettable. Consider it the perfect Valentine's date night out.", [["Partner","Southern Glazer's (SGWS)"],["Partner","Tsar Nicoulai Caviar"],["Partner","Hog Island Oyster Co."]], "A bottled infused syrup, recipe cards, and a discount on Tsar Nicoulai caviar.", "$125 per guest  ·  Thursday, February 11  ·  4-6pm  ·  AH Bar  ·  10 guests"]
    ]],
    ["March", [
      ["Craft", "Chèvre, Wine & Wildflowers", "Unwind the week and gather your favorite people for the ultimate girls' night out, equal parts cheese, wine, and wildflowers. Female-owned Spenker Farms pours their wines and shares their celebrated goat cheese, woven into curated bites by Chef Robert of Americana House, while female-owned Embellish Design leads a hands-on floral arranging class. Leave with a vibrant arrangement, a little buzz, and plenty of color to carry home.", [["Partner","Spenker Farms"],["Partner","Embellish Design"]], "A floral arrangement you made yourself, a goat cheese sample, and a discount for more.", "$125 per guest  ·  Friday, March 12  ·  5-7pm  ·  12 guests"]
    ]],
    ["April", [
      ["Culinary", "Pizza Like a Pro", "Chef Robert Ito hands you the keys to the ultimate pizza masterclass, fired in a roaring Gozney oven. You will learn to coax the perfect dough and read the heat like a pro, then Matt Jones of Honest Acres rolls in a bushel of just-picked local produce to crown your own pie. Because pizza was made for wine, you will sip a featured pour throughout, and walk away knowing how to shape, build, fire, and pair like a true pizzaiolo, just in time for summer.", [["Partner","Gozney"],["Partner","Honest Acres"],["Partner","Featured winery (TBD)"]], "Gozney dough, fresh produce from Honest Acres, and the recipe for the perfect sauce.", "$115 per guest  ·  Saturday, April 17  ·  4-6pm  ·  12 guests", "Select a winery partner"]
    ]],
    ["May", [
      ["Culinary", "Kiddo Cookie Decorating", "We invite parents and littles alike to join us for a fun, all-ages cookie decorating class with pastry chef Anne. Gather in Maison Lodi for an alfresco class on the patio one Saturday morning, with mimosas for mom and fun drinks for the kids, and learn the techniques to create expertly designed spring cookies that taste as good as they look. Take home a box for snacking later and a recipe to keep the fun going.", [], "A box of custom cookies made by you, cookie cutters, and the perfect sugar cookie and icing recipe.", "$120 per parent + child combo (+$40 per additional child)  ·  Saturday, May 8  ·  10am-12pm  ·  Maison Lodi patio"]
    ]],
    ["June", [
      ["Culinary", "Beef & Bourbon on the Big Green Egg", "Two and a half hours, three exceptional cuts, and three premium bourbons from the house of WhistlePig, and just in time to be the perfect Father's Day gift. A Big Green Egg expert and Chef Charlie Palmer open with the question every serious cook should be able to answer: what really separates American wagyu from certified black angus, and how do you spot the best cut at the counter? Then you put theory to fire with wagyu flat iron, New York strip, and brisket, whisking together a bourbon marinade worth stealing, and learning to work the coals like you were born to it. A bourbon aficionado leads the tasting, showing you how each expression plays against the beef on your plate. You will leave able to buy beef like a butcher and grill it like a chef.", [["Partner","Big Green Egg"],["Partner","WhistlePig"]], "A Big Green Egg apron, recipes, and the know-how to buy, grill, and pair premium beef like a pro.", "Date and venue to be confirmed", "Confirm Lodi lead, date, and venue"]
    ]]
  ];

  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const PROPERTIES = {
    "Healdsburg": { label: "Healdsburg", years: {
      "2026": { data: DATA_2026, sub: "Healdsburg  &middot;  August to December 2026" },
      "2027": { data: DATA_2027, sub: "Healdsburg  &middot;  January to June 2027" }
    }},
    "Lodi": { label: "Lodi", years: {
      "2027": { data: DATA_L2027, sub: "Lodi  &middot;  January to June 2027" }
    }}
  };

  const root = document.getElementById("months");
  const subEl = document.querySelector(".header-sub");
  const labelEl = document.getElementById("propertyLabel");
  const yearTabsEl = document.getElementById("yearTabs");
  let currentProperty = "Healdsburg";
  let currentYear = "2026";

  function detailGrid(str){
    const parts = str.split(/\s+\u00b7\s+/).map(s => s.trim()).filter(Boolean);
    const cells = parts.map(s => {
      let label = "Venue";
      if(/^\$/.test(s)) label = "Price";
      else if(/(guests|pairs)$/i.test(s)) label = "Guests";
      else if(/^ages /i.test(s)) label = "Ages";
      else if(/\b(mon|tues|wednes|thurs|fri|satur|sun)day\b|date tbd|\bdate\b/i.test(s)) label = "Date";
      else if(/^approximately|\d\s?(am|pm)/i.test(s)) label = "Time";
      return {label, s};
    });
    const order = ["Date","Time","Price","Venue","Guests","Ages"];
    cells.sort((a,b) => order.indexOf(a.label) - order.indexOf(b.label));
    return '<div class="detail-grid">' + cells.map(c =>
      `<div class="detail-cell${c.label==="Price"?' price':''}"><span class="detail-k">${c.label}</span><span class="detail-v">${esc(c.s)}</span></div>`
    ).join("") + '</div>';
  }

  function renderMonths(data, sub){
    root.innerHTML = "";
    if(subEl) subEl.innerHTML = "Suggested Monthly Programming &nbsp;&middot;&nbsp; " + sub;
    if(!data || !data.length){
      root.innerHTML = '<div class="year-empty">Programming is being crafted. Check back soon.</div>';
      return;
    }
    data.forEach(([month, classes]) => {
      const block = document.createElement("div");
      block.className = "month-block";
      const cards = classes.map(([kicker, name, desc, partners, takeaway, details, flag]) => {
        const flagRow = flag ? `<div class="flag">&#9873; ${esc(flag)}</div>` : "";
        const badges = (partners || []).map(([type, who]) =>
          `<span class="badge ${type.toLowerCase()}"><span class="badge-kicker">${esc(type)}</span>${esc(who)}</span>`
        ).join("");
        const partnerVal = badges
          ? `<div class="badges">${badges}</div>`
          : `<span class="meta-tbd">To be confirmed</span>`;
        const detailsRow = details
          ? `<div class="meta-row">
                <span class="meta-label">Details</span>
                <div class="meta-val">${detailGrid(details)}</div>
              </div>`
          : "";
        return `
          <div class="class-card ${kicker.toLowerCase()}${flag ? ' flagged' : ''}">
            ${flagRow}
            <div class="kicker">${esc(kicker)}</div>
            <div class="class-name">${esc(name)}</div>
            <div class="class-desc">${esc(desc)}</div>
            <div class="card-meta">
              ${detailsRow}
              <div class="meta-row">
                <span class="meta-label">Partners</span>
                <div class="meta-val">${partnerVal}</div>
              </div>
              <div class="meta-row">
                <span class="meta-label">Takeaways</span>
                <div class="meta-val takeaway">${esc(takeaway || "")}</div>
              </div>
            </div>
          </div>`;
      }).join("");
      block.innerHTML = `
        <div class="month-head">
          <div class="month-name">${esc(month)}</div>
          <div class="month-dot">&#10022;</div>
          <div class="month-line"></div>
        </div>
        <div class="class-grid" ${classes.length===1?'style="grid-template-columns:1fr"':''}>${cards}</div>`;
      root.appendChild(block);
    });
  }

  function update(){
    if(labelEl) labelEl.textContent = PROPERTIES[currentProperty].label;
    const info = PROPERTIES[currentProperty].years[currentYear];
    renderMonths(info.data, info.sub);
  }

  function renderYearTabs(){
    const years = Object.keys(PROPERTIES[currentProperty].years);
    if(!years.includes(currentYear)) currentYear = years[0];
    yearTabsEl.innerHTML = years.map(y =>
      `<button class="year-tab${y===currentYear?' active':''}" data-year="${y}">${y}</button>`
    ).join("");
    yearTabsEl.querySelectorAll(".year-tab").forEach(btn =>
      btn.addEventListener("click", () => {
        currentYear = btn.dataset.year;
        renderYearTabs();
        update();
      })
    );
  }

  document.querySelectorAll(".property-tab").forEach(btn =>
    btn.addEventListener("click", () => {
      document.querySelectorAll(".property-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentProperty = btn.dataset.property;
      renderYearTabs();
      update();
    })
  );

  renderYearTabs();
  update();
</script>

</body>
</html>
